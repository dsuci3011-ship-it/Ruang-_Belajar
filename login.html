<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RuangBelajar | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" 
    rel="stylesheet">
  </head>
  <body class="login-page">
    <nav class="navbar navbar-dark main-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Ruang<span>Belajar</span>
        </a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill">← Beranda</a>
      </div>
    </nav>
    <main class="login-wrap">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-sm-10 col-md-7 col-lg-5">
            <section class="login-card">
              <div class="text-center mb-4">
                <div class="login-symbol">RB</div>
                <span class="eyebrow">SELAMAT DATANG</span>
                <h1 class="h2 mt-2">Login RuangBelajar</h1>
                <p class="text-secondary">Masuk untuk mencoba validasi form demo.</p>
              </div>
              <div id="loginMessage" class="alert d-none" role="alert" aria-live="polite">

              </div>
              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control form-control-lg" 
                  id="email" 
                  name="email" 
                  placeholder="nama@email.com" 
                  autocomplete="username">
                  <div class="invalid-feedback">Masukkan email dengan format yang benar.</div>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control form-control-lg" 
                  id="password" 
                  name="password" 
                  placeholder="Minimal 8 karakter" 
                  autocomplete="current-password">
                  <div class="invalid-feedback">Password wajib diisi dan minimal 8 karakter.</div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill mt-2">Login</button>
                <p class="small text-secondary text-center mt-3 mb-0">Ini hanya simulasi validasi browser, bukan sistem akun asli.</p>
              </form>
            </section>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container text-center">© 2026 RuangBelajar</div>
    </footer>
    <script src="assets/js/script.js">

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

    </script>
    </body>
</html>
